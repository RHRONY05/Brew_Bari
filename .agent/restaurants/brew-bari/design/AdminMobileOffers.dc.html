<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offers on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6B4226}a:hover{color:#24170F}
.bb{font-family:"Plus Jakarta Sans","Hind Siliguri",system-ui,sans-serif;color:#24170F}
.bb button{font-family:inherit;cursor:pointer}
.tab{height:40px;padding:0 11px;border-radius:999px;color:#6F5A4B;font-size:14px;font-weight:700;white-space:nowrap;display:flex;align-items:center;text-decoration:none;flex:none}
.tab.on{background:#24170F;color:#FFF7EE}
.offer{background:#FFFFFF;border-radius:20px;box-shadow:0 6px 20px rgba(107,66,38,.08);overflow:hidden}
.ban{height:104px;position:relative;overflow:hidden;padding:14px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;justify-content:center}
.sw{width:52px;height:30px;border-radius:999px;border:none;padding:3px;display:flex;flex:none}
.sw span{width:24px;height:24px;border-radius:999px;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:#2F7D57;justify-content:flex-end}
.sw.off{background:#D9C7B4;justify-content:flex-start}
.st{height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:800;display:inline-flex;align-items:center}
</style>
</helmet>
<div class="bb" style="width: 390px; height: 844px; position: relative; background: #FFF7EE; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #F0DFCB">
    <div style="padding: 16px 16px 10px; display: flex; align-items: center; gap: 10px">
      <div style="width: 38px; height: 38px; border-radius: 999px; background: #6B4226; color: #F2C27D; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">BB</div>
      <div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Brew Bari</div><div style="font-size: 11.5px; color: #6F5A4B">Admin</div></div>
      <a href="CounterMobile.dc.html" style="height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid #F0DFCB; color: #24170F; font-size: 13px; font-weight: 700; display: flex; align-items: center; text-decoration: none">Counter</a>
    </div>
    <nav aria-label="Admin" style="display: flex; gap: 2px; padding: 0 10px 10px; overflow-x: auto">
      <a class="tab" href="AdminMobile.dc.html">Menu</a>
      <a class="tab on" href="AdminMobileOffers.dc.html" aria-current="page">Offers</a>
      <a class="tab" href="AdminMobileTables.dc.html">Tables</a>
      <a class="tab" href="AdminMobileSettings.dc.html">Settings</a>
      <a class="tab" href="AdminMobileFeedback.dc.html">Feedback</a>
    </nav>
  </header>

  <div style="padding: 14px 16px 8px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em">Offers</h1>
    <div style="font-size: 12.5px; color: #6F5A4B">Live offers appear in the banner at the top of the menu.</div>
  </div>

  <div style="padding: 4px 12px 100px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{offers}}" as="o" hint-placeholder-count="3">
      <article class="offer">
        <div class="ban" style="{{o.banStyle}}">
          <span style="position: absolute; right: -30px; top: -40px; width: 150px; height: 150px; border-radius: 999px; background: rgba(255,255,255,.10)"></span>
          <span style="align-self: flex-start; height: 20px; padding: 0 8px; border-radius: 999px; background: #F2C27D; color: #24170F; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center">{{o.badge}}</span>
          <span style="font-size: 18px; font-weight: 800; color: #FFF7EE; line-height: 22px">{{o.title}}</span>
          <span style="font-size: 12px; color: #F3E3CF">{{o.sub}}</span>
        </div>
        <div style="padding: 12px 14px; display: flex; align-items: center; gap: 10px">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span class="st" style="{{o.stStyle}}">{{o.status}}</span>
            <span style="font-size: 12px; color: #6F5A4B; font-weight: 600">{{o.meta}}</span>
          </div>
          <button class="{{o.swCls}}" role="switch" aria-checked="{{o.on}}" aria-label="{{o.swLabel}}" onClick="{{o.toggle}}"><span></span></button>
          <button aria-label="{{o.editLabel}}" style="width: 40px; height: 44px; border: none; background: transparent; color: #8C7767; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
          </button>
        </div>
      </article>
    </sc-for>
  </div>

  <button style="position: absolute; right: 16px; bottom: 24px; height: 54px; padding: 0 22px; border: none; border-radius: 999px; background: #F2C27D; color: #24170F; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(227,166,81,.45)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    New offer
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { off: {} };
  }
  renderVals() {
    const defs = [
      ['mango', 'Seasonal', 'Mango season is here', 'Fresh mango juice, only ৳220', 'live', 'Links to Mango Juice · no end date', '#6B4226'],
      ['combo', 'Save ৳50', 'Morning Combo', 'Cappuccino + Croissant', 'live', 'Links to Morning Combo · ends 31 Oct', '#8A5A37'],
      ['happy', 'Mon–Thu', 'Happy Hour 3–5 PM', 'Buy 1 get 1 on cold coffee', 'scheduled', 'Starts Mon 3:00 PM · Cold Coffee', '#5B3A22']
    ];
    const offers = defs.map(([id, badge, title, sub, kind, meta, bg]) => {
      const on = !this.state.off[id];
      const status = !on ? 'Paused' : kind === 'live' ? 'Live now' : 'Scheduled';
      const stStyle = !on ? 'background:#F0E6DA;color:#6F5A4B' : kind === 'live' ? 'background:#E7F3EC;color:#1F5C3F' : 'background:#E3EDFA;color:#22508F';
      return {
        badge, title, sub, meta, status, stStyle,
        banStyle: 'background:' + bg + (on ? '' : ';filter:grayscale(.7);opacity:.7'),
        swCls: on ? 'sw on' : 'sw off', on: on ? 'true' : 'false',
        swLabel: title + ' active', editLabel: 'Edit ' + title,
        toggle: () => this.setState({ off: Object.assign({}, this.state.off, { [id]: on }) })
      };
    });
    return { offers };
  }
}
</script>
</body>
</html>
