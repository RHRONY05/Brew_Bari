<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cart sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6B4226}a:hover{color:#24170F}
.bb{font-family:"Plus Jakarta Sans","Hind Siliguri",system-ui,sans-serif;color:#24170F}
.bb button{font-family:inherit;cursor:pointer}
.line{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #F6E9DA}
.th{width:64px;height:64px;border-radius:16px;background:#FBEBD7;flex:none;display:flex;align-items:center;justify-content:center;color:#B98A5E}
.mini{display:flex;align-items:center;gap:2px;background:#FFF7EE;border-radius:999px;padding:2px}
.mini button{width:36px;height:36px;border:none;border-radius:999px;background:transparent;color:#24170F;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="bb" style="width: 390px; height: 844px; position: relative; background: #FFF7EE; overflow: hidden">
  <div style="position: absolute; inset: 0; background: rgba(36,23,15,.45)"></div>
  <div role="dialog" aria-label="Your order" style="position: absolute; left: 0; right: 0; top: 96px; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding: 10px 0 0"><span style="width: 40px; height: 5px; border-radius: 999px; background: #E9D3B8"></span></div>
    <div style="padding: 10px 16px 4px; display: flex; justify-content: space-between; align-items: center">
      <div>
        <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em">Your order</h1>
        <div style="font-size: 13px; color: #6F5A4B">Table 5 · 4 items</div>
      </div>
      <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #FFF7EE; display: flex; align-items: center; justify-content: center; color: #24170F">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="flex: 1; overflow: hidden; padding: 0 16px">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
        <div class="line">
          <div class="th">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"></path><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"></path></svg>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <div style="display: flex; justify-content: space-between; gap: 8px">
              <span style="font-size: 15px; font-weight: 700">{{l.name}}</span>
              <span style="font-size: 15px; font-weight: 800">{{l.total}}</span>
            </div>
            <span style="font-size: 12.5px; line-height: 17px; color: #6F5A4B">{{l.opts}}</span>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px">
              <span style="font-size: 12px; color: #8C7767">{{l.each}} each</span>
              <div class="mini">
                <button aria-label="Decrease"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
                <span style="min-width: 18px; text-align: center; font-weight: 800; font-size: 14px">{{l.qty}}</span>
                <button aria-label="Increase"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
              </div>
            </div>
          </div>
        </div>
      </sc-for>

      <label for="note" style="display: block; margin-top: 16px; font-size: 13px; font-weight: 700">Note for the kitchen</label>
      <input id="note" placeholder="e.g. bring the brownie with the coffee" style="margin-top: 6px; width: 100%; box-sizing: border-box; height: 46px; border-radius: 14px; border: 1px solid #F0DFCB; background: #FFF7EE; padding: 0 14px; font: inherit; font-size: 14px; color: #24170F">

      <div style="margin-top: 18px; display: flex; justify-content: space-between; font-size: 15px">
        <span style="color: #6F5A4B">Subtotal</span><span style="font-weight: 800">৳1,150</span>
      </div>
      <div style="margin-top: 4px; font-size: 12px; color: #8C7767">VAT is added on the bill. Prices are confirmed by the café.</div>
    </div>

    <div style="padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #F6E9DA">
      <a href="Status.dc.html" style="height: 54px; border-radius: 999px; background: #F2C27D; color: #24170F; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">Place order · ৳1,150</a>
      <a href="Status.dc.html" style="height: 46px; border-radius: 999px; border: 1px solid #F0DFCB; color: #6B4226; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15V11a6 6 0 0 1 12 0v4l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
        Call waiter instead
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      lines: [
        { name: 'Caramel Macchiato', opts: 'Large · Oat milk · Less sugar · Extra shot', each: '৳490', qty: 1, total: '৳490' },
        { name: 'Iced Latte', opts: 'Regular · No sugar', each: '৳280', qty: 1, total: '৳280' },
        { name: 'Chocolate Brownie', opts: 'Served warm', each: '৳190', qty: 2, total: '৳380' }
      ]
    };
  }
}
</script>
</body>
</html>
