<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Counter on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6B4226}a:hover{color:#24170F}
.bb{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#24170F}
.bb button{font-family:inherit;cursor:pointer}
.tile{width:58px;height:58px;border-radius:14px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;padding:0}
.tile b{font-size:20px;line-height:22px;font-weight:800}
.tile span{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.ftab{height:38px;padding:0 12px;border-radius:999px;border:1px solid #F0DFCB;background:#FFFFFF;font-size:13px;font-weight:700;color:#24170F;display:flex;align-items:center;gap:6px;flex:none}
.ftab.on{background:#24170F;border-color:#24170F;color:#FFF7EE}
.cnt{min-width:18px;height:18px;border-radius:999px;background:#FBEBD7;color:#24170F;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.req{background:#FFFFFF;border-radius:20px;box-shadow:0 6px 20px rgba(107,66,38,.08);padding:14px;display:flex;flex-direction:column;gap:10px;border:2px solid transparent}
.tb{width:48px;height:48px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.tb b{font-size:20px;line-height:22px;font-weight:800}
.tb span{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.flag{height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:800;display:inline-flex;align-items:center}
.btn-p{flex:1;height:52px;border:none;border-radius:999px;background:#F2C27D;color:#24170F;font-size:15px;font-weight:800}
.btn-s{height:52px;padding:0 18px;border-radius:999px;border:1px solid #F0DFCB;background:#FFFFFF;color:#6F5A4B;font-size:14px;font-weight:700}
</style>
</helmet>
<div class="bb" style="width: 390px; height: 1100px; position: relative; background: #FFF7EE; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #F0DFCB; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1">
        <div style="font-size: 17px; font-weight: 800">Counter</div>
        <div style="font-size: 12px; color: #6F5A4B">Brew Bari · P3</div>
      </div>
      <span style="height: 28px; padding: 0 10px; border-radius: 999px; background: #E7F3EC; color: #1F5C3F; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #2F9E6B"></span>Live</span>
      <button aria-label="Sound on" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #F0DFCB; background: #FFFFFF; color: #24170F; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 9a4 4 0 0 1 0 6"></path></svg>
      </button>
      <a href="AdminMobile.dc.html" aria-label="Admin" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #F0DFCB; color: #24170F; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
      </a>
    </div>
    <div aria-label="Tables" style="display: flex; gap: 6px; overflow-x: auto">
      <sc-for list="{{tables}}" as="t" hint-placeholder-count="8">
        <button class="tile" style="{{t.style}}" aria-label="{{t.aria}}"><b>{{t.n}}</b><span>{{t.short}}</span></button>
      </sc-for>
    </div>
  </header>

  <div style="display: flex; gap: 6px; padding: 12px 12px 4px; overflow-x: auto">
    <sc-for list="{{tabs}}" as="f" hint-placeholder-count="4">
      <button class="{{f.cls}}" onClick="{{f.pick}}">{{f.label}} <span class="cnt">{{f.count}}</span></button>
    </sc-for>
  </div>

  <div style="padding: 8px 12px 24px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{reqs}}" as="r" hint-placeholder-count="4">
      <article class="req" style="{{r.border}}">
        <div style="display: flex; gap: 12px; align-items: center">
          <div class="tb" style="{{r.badge}}"><span>Table</span><b>{{r.table}}</b></div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 15px; font-weight: 800">{{r.title}}</div>
            <div style="font-size: 12px; color: #6F5A4B; font-weight: 600">{{r.meta}}</div>
          </div>
          <sc-if value="{{r.hasFlag}}" hint-placeholder-val="{{false}}"><span class="flag" style="{{r.flagStyle}}">{{r.flag}}</span></sc-if>
        </div>
        <sc-if value="{{r.hasLines}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 3px; font-size: 14px; padding: 10px 12px; border-radius: 14px; background: #FFF7EE">
            <sc-for list="{{r.lines}}" as="l" hint-placeholder-count="2"><div>{{l}}</div></sc-for>
          </div>
        </sc-if>
        <div style="display: flex; gap: 8px">
          <button class="btn-p">{{r.primary}}</button>
          <sc-if value="{{r.hasSecondary}}" hint-placeholder-val="{{true}}"><button class="btn-s">{{r.secondary}}</button></sc-if>
        </div>
      </article>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const S = {
      free: 'background:#FFFFFF;border-color:#F0DFCB;color:#6F5A4B',
      scanned: 'background:#FFF4D1;border-color:#E9C95A;color:#6E5500',
      open: 'background:#E7F3EC;border-color:#9ED1B6;color:#1F5C3F',
      calling: 'background:#FDEBD2;border-color:#C77C0E;color:#8A4D06',
      order: 'background:#FBE3E0;border-color:#B83B30;color:#9A2F25',
      bill: 'background:#E3EDFA;border-color:#7FA6DE;color:#22508F'
    };
    const tdefs = [[1, 'free', 'Free'], [2, 'open', 'Seated'], [3, 'calling', 'Call'], [4, 'free', 'Free'], [5, 'order', 'Order'], [6, 'bill', 'Bill'], [7, 'scanned', 'Scan'], [8, 'open', 'Seated']];
    const all = [
      { kind: 'orders', table: 5, title: 'New order #2', meta: 'just now · ৳1,150', border: 'border-color:#B83B30', badge: 'background:#FBE3E0;color:#9A2F25',
        hasFlag: true, flag: 'NEW', flagStyle: 'background:#FBE3E0;color:#9A2F25',
        lines: ['1× Caramel Macchiato · Large, Oat, Extra shot', '1× Iced Latte', '2× Chocolate Brownie'], primary: 'Accept', secondary: 'Cancel' },
      { kind: 'calls', table: 3, title: 'Calling waiter', meta: '2 min ago · list ৳780', border: 'border-color:#C77C0E', badge: 'background:#FDEBD2;color:#8A4D06',
        hasFlag: true, flag: 'Again ×1', flagStyle: 'background:#FDEBD2;color:#8A4D06',
        lines: ['2× Cappuccino · Large, Oat'], primary: 'Waiter sent', secondary: 'Done' },
      { kind: 'bills', table: 6, title: 'Bill requested', meta: '3 min ago · total ৳987', border: '', badge: 'background:#E3EDFA;color:#22508F',
        hasFlag: false, lines: [], primary: 'Bill sent', secondary: 'View' },
      { kind: 'calls', table: 7, title: 'Calling waiter', meta: '4 min ago · no list', border: '', badge: 'background:#FFF4D1;color:#6E5500',
        hasFlag: true, flag: 'Unverified', flagStyle: 'background:#FFF4D1;color:#6E5500',
        lines: [], primary: 'Approve & send', secondary: 'Dismiss' },
      { kind: 'orders', table: 5, title: 'Order #1 · Preparing', meta: '12 min ago · ৳530', border: '', badge: 'background:#E7F3EC;color:#1F5C3F',
        hasFlag: false, lines: ['1× Cappuccino', '1× Iced Latte'], primary: 'Ready', secondary: '' }
    ];
    const f = this.state.filter;
    const reqs = all.filter((r) => f === 'all' || r.kind === f).map((r) => Object.assign({}, r, {
      hasLines: r.lines.length > 0, hasSecondary: !!r.secondary
    }));
    const tabDefs = [['all', 'All'], ['calls', 'Calls'], ['orders', 'Orders'], ['bills', 'Bills']];
    return {
      tables: tdefs.map(([n, k, short]) => ({ n, short, style: S[k], aria: 'Table ' + n + ', ' + short })),
      tabs: tabDefs.map(([id, label]) => ({
        label, count: id === 'all' ? all.length : all.filter((r) => r.kind === id).length,
        cls: f === id ? 'ftab on' : 'ftab', pick: () => this.setState({ filter: id })
      })),
      reqs
    };
  }
}
</script>
</body>
</html>
