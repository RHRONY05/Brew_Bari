<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Item detail sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6B4226}a:hover{color:#24170F}
.bb{font-family:"Plus Jakarta Sans","Hind Siliguri",system-ui,sans-serif;color:#24170F}
.bb button{font-family:inherit;cursor:pointer}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline}
.grp-t{font-size:15px;font-weight:700}
.req{font-size:11px;font-weight:700;color:#8A5A37;background:#FBEBD7;border-radius:999px;padding:3px 8px}
.opt{font-size:11px;font-weight:600;color:#8C7767}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{height:40px;padding:0 14px;border-radius:999px;border:1px solid #F0DFCB;background:#FFFFFF;color:#24170F;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.pill.on{background:#6B4226;border-color:#6B4226;color:#FFF7EE}
.delta{font-size:12px;font-weight:700;opacity:.75}
.step{width:40px;height:40px;border-radius:999px;border:none;background:#FBEBD7;color:#24170F;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="bb" style="width: 390px; height: 844px; position: relative; background: #FFF7EE; overflow: hidden">
  <!-- dimmed menu behind -->
  <div style="padding: 20px 16px; display: flex; gap: 12px; align-items: center">
    <div style="width: 48px; height: 48px; border-radius: 999px; background: #6B4226"></div>
    <div style="font-size: 24px; font-weight: 800">Brew Bari</div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(36,23,15,.45)"></div>

  <!-- sheet -->
  <div role="dialog" aria-label="{{name}}" style="position: absolute; left: 0; right: 0; top: 44px; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 30px rgba(36,23,15,.12); display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding: 10px 0 4px"><span style="width: 40px; height: 5px; border-radius: 999px; background: #E9D3B8"></span></div>
    <div style="flex: 1; overflow: hidden; padding: 6px 16px 0; display: flex; flex-direction: column; gap: 16px">
      <div style="position: relative; height: 180px; border-radius: 20px; background: #FBEBD7; display: flex; align-items: center; justify-content: center; color: #B98A5E">
        <svg width="88" height="88" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"></path><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"></path><path d="M8 3c-.6.8-.6 1.6 0 2.4M11.5 3c-.6.8-.6 1.6 0 2.4"></path></svg>
        <span style="position: absolute; top: 12px; left: 12px; height: 24px; padding: 0 10px; border-radius: 999px; background: #F2C27D; font-size: 11px; font-weight: 800; letter-spacing: .04em; display: flex; align-items: center">BESTSELLER</span>
        <a href="Main.dc.html" aria-label="Close" style="position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #24170F">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </a>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
          <h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 800; letter-spacing: -.02em">{{name}}</h1>
          <span style="font-size: 18px; font-weight: 800">৳300</span>
        </div>
        <p style="margin: 0; font-size: 14px; line-height: 20px; color: #6F5A4B">Vanilla milk, espresso and a caramel drizzle. Served hot.</p>
      </div>

      <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
        <div class="grp">
          <div class="grp-h">
            <span class="grp-t">{{g.title}}</span>
            <sc-if value="{{g.required}}" hint-placeholder-val="{{false}}"><span class="req">Required</span></sc-if>
            <sc-if value="{{g.optional}}" hint-placeholder-val="{{true}}"><span class="opt">{{g.hint}}</span></sc-if>
          </div>
          <div class="pills">
            <sc-for list="{{g.choices}}" as="c" hint-placeholder-count="3">
              <button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}<sc-if value="{{c.hasDelta}}" hint-placeholder-val="{{false}}"><span class="delta">{{c.delta}}</span></sc-if></button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="padding: 12px 16px 20px; border-top: 1px solid #F6E9DA; display: flex; gap: 12px; align-items: center; background: #FFFFFF">
      <div style="display: flex; align-items: center; gap: 6px; background: #FFF7EE; border-radius: 999px; padding: 4px">
        <button class="step" aria-label="Decrease quantity" onClick="{{dec}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        <span style="min-width: 22px; text-align: center; font-weight: 800; font-size: 16px">{{qty}}</span>
        <button class="step" aria-label="Increase quantity" onClick="{{inc}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
      <a href="Cart.dc.html" style="flex: 1; height: 52px; border-radius: 999px; background: #F2C27D; color: #24170F; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Add · {{total}}</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { size: 'large', milk: 'oat', sugar: 'less', extras: { shot: true }, qty: 1 };
  }
  renderVals() {
    const s = this.state;
    const defs = [
      { id: 'size', title: 'Size', type: 'single', required: true, choices: [['regular', 'Regular', 0], ['large', 'Large', 60]] },
      { id: 'milk', title: 'Milk', type: 'single', hint: 'Optional · pick 1', choices: [['regular', 'Regular milk', 0], ['oat', 'Oat milk', 80]] },
      { id: 'sugar', title: 'Sugar', type: 'single', hint: 'Optional · pick 1', choices: [['none', 'No sugar', 0], ['less', 'Less', 0], ['normal', 'Normal', 0]] },
      { id: 'extras', title: 'Extras', type: 'multi', hint: 'Optional · any', choices: [['shot', 'Extra shot', 50], ['caramel', 'Caramel syrup', 40], ['cream', 'Whipped cream', 40]] }
    ];
    let delta = 0;
    const groups = defs.map((g) => ({
      title: g.title, required: !!g.required, optional: !g.required, hint: g.hint || '',
      choices: g.choices.map(([id, label, d]) => {
        const on = g.type === 'multi' ? !!s.extras[id] : s[g.id] === id;
        if (on) delta += d;
        return {
          label, on: on ? 'true' : 'false', cls: on ? 'pill on' : 'pill',
          hasDelta: d > 0, delta: '+৳' + d,
          pick: () => g.type === 'multi'
            ? this.setState({ extras: Object.assign({}, s.extras, { [id]: !s.extras[id] }) })
            : this.setState({ [g.id]: id })
        };
      })
    }));
    const total = (300 + delta) * s.qty;
    return {
      name: 'Caramel Macchiato', groups, qty: s.qty,
      total: '৳' + total.toLocaleString('en-IN'),
      inc: () => this.setState({ qty: Math.min(20, s.qty + 1) }),
      dec: () => this.setState({ qty: Math.max(1, s.qty - 1) })
    };
  }
}
</script>
</body>
</html>
