<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grill Ghar order tracking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&amp;family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#3a2620}
a{color:#D2291C;text-decoration:none}a:hover{color:#8E1A12}
</style>
</helmet>
<div style="width: 390px; min-height: 900px; box-sizing: border-box; background: rgba(43,21,16,0.55); font-family: Poppins, sans-serif; color: #2B1510; display: flex; flex-direction: column; justify-content: flex-end; padding-top: 40px">
  <section role="dialog" aria-modal="true" aria-labelledby="status-h" style="background: #FFF5EA; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; flex: 1">
    <div aria-hidden="true" style="width: 44px; height: 5px; border-radius: 3px; background: #E2C3AD; align-self: center; margin: 10px 0 0"></div>
    <header style="display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px">
      <h2 id="status-h" style="margin: 0; flex: 1; font-family: Cinzel, serif; font-weight: 800; font-size: 22px">Table 7</h2>
      <a href="Main.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; border: 1px solid #F0DCC8; display: flex; align-items: center; justify-content: center; color: #2B1510">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </a>
    </header>

    <!-- Big live status card -->
    <div style="margin: 0 16px; background: #2B1510; color: #FFF5EA; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 14px 30px rgba(43,21,16,0.3)">
      <div style="display: flex; align-items: center; gap: 14px">
        <div style="width: 56px; height: 56px; border-radius: 18px; background: {{heroIconBg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2B1510" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{heroIcon}}"></path></svg>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; color: #EBD3C2; font-weight: 500">Order 1 · sent 7:42 pm</span>
          <span style="font-family: Cinzel, serif; font-weight: 800; font-size: 22px; line-height: 1.1">{{heroTitle}}</span>
          <span style="font-size: 13px; color: #FFB22C; font-weight: 600">{{heroSub}}</span>
        </div>
      </div>
      <div aria-hidden="true" style="height: 8px; border-radius: 4px; background: rgba(255,245,234,0.15); overflow: hidden">
        <div style="height: 8px; width: {{progress}}; background: #FFB22C; border-radius: 4px"></div>
      </div>
    </div>

    <!-- Stepper -->
    <ol aria-label="Order progress" style="list-style: none; margin: 0; padding: 20px 16px 0 16px; display: flex; flex-direction: column">
      <sc-for list="{{steps}}" as="st" hint-placeholder-count="5">
        <li aria-current="{{st.current}}" style="display: flex; gap: 14px; min-height: 52px">
          <div style="display: flex; flex-direction: column; align-items: center; width: 28px">
            <span style="width: 28px; height: 28px; border-radius: 50%; background: {{st.dotBg}}; border: {{st.dotBorder}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: {{st.glow}}">
              <sc-if value="{{st.done}}" hint-placeholder-val="{{true}}">
                <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFF5EA" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
              </sc-if>
            </span>
            <sc-if value="{{st.hasLine}}" hint-placeholder-val="{{true}}">
              <span aria-hidden="true" style="width: 3px; flex: 1; min-height: 22px; background: {{st.lineBg}}; border-radius: 2px"></span>
            </sc-if>
          </div>
          <div style="display: flex; flex-direction: column; gap: 1px; padding-top: 3px; padding-bottom: 12px">
            <span style="font-weight: {{st.weight}}; font-size: 15px; color: {{st.ink}}">{{st.label}}</span>
            <span style="font-size: 12px; color: #6B4A3F">{{st.hint}}</span>
          </div>
        </li>
      </sc-for>
    </ol>

    <!-- Order summary -->
    <div style="margin: 6px 16px 0; background: #FFFFFF; border: 1px solid #F0DCC8; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span><span style="font-weight: 700">1×</span> Naga Smash Burger <span style="background: #FFB22C; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 999px">MEAL</span></span><span style="font-weight: 600">৳510</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span><span style="font-weight: 700">1×</span> Hot Wings · 6 pc</span><span style="font-weight: 600">৳300</span></div>
      <div style="border-top: 1px dashed #E2C3AD; padding-top: 8px; display: flex; justify-content: space-between; font-weight: 800; font-size: 15px"><span>Order total</span><span>৳810</span></div>
    </div>

    <!-- Actions -->
    <div style="margin-top: auto; padding: 18px 16px 18px; display: flex; gap: 10px">
      <button type="button" style="flex: 1; height: 54px; border-radius: 16px; border: 1.5px solid #2B1510; background: #FFFFFF; color: #2B1510; font: 600 14px Poppins, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        Call waiter
      </button>
      <a href="Main.dc.html" style="flex: 1; height: 54px; border-radius: 16px; background: #D2291C; color: #FFF5EA; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        Order more
      </a>
    </div>
    <div style="padding: 0 16px 20px; text-align: center">
      <button type="button" style="border: 0; background: transparent; font: 600 14px Poppins, sans-serif; color: #8E1A12; min-height: 44px; text-decoration: underline">Request the bill</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"enum","options":["received","accepted","grilling","ready","served"],"default":"grilling"},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const stages = [
      { id: 'received', label: 'Received', hint: 'The counter has your order', title: 'Order received', sub: 'Waiting for the counter', icon: 'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11' },
      { id: 'accepted', label: 'Accepted', hint: 'Staff confirmed it', title: 'Order accepted', sub: 'Going to the grill next', icon: 'M20 6 9 17l-5-5' },
      { id: 'grilling', label: 'On the grill', hint: 'Cooking now, ~8 min', title: 'On the grill', sub: 'About 8 min left', icon: 'M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1.2-3.6 2.4-4.6.3 1.7 1.1 2.6 2.1 3.1C11 9 11 6 12 3z' },
      { id: 'ready', label: 'Ready', hint: 'Coming to your table', title: 'Ready!', sub: 'A waiter is bringing it', icon: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0' },
      { id: 'served', label: 'Served', hint: 'Enjoy your meal', title: 'Enjoy your meal', sub: 'Tap "Order more" anytime', icon: 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7' },
    ];
    const stage = this.props.stage ?? 'grilling';
    const cur = Math.max(0, stages.findIndex((s) => s.id === stage));
    const steps = stages.map((s, i) => {
      const done = i < cur || (i === cur && i === stages.length - 1);
      const now = i === cur;
      return {
        label: s.label, hint: s.hint, done,
        current: now ? 'step' : 'false',
        dotBg: done ? '#D2291C' : now ? '#FFB22C' : '#FFFFFF',
        dotBorder: done || now ? '0' : '2px solid #E2C3AD',
        glow: now && !done ? '0 0 0 6px rgba(255,178,44,0.28)' : 'none',
        hasLine: i < stages.length - 1,
        lineBg: i < cur ? '#D2291C' : '#E2C3AD',
        weight: now ? 700 : 500,
        ink: i <= cur ? '#2B1510' : '#8A6A5E',
      };
    });
    const s = stages[cur];
    return {
      steps,
      heroTitle: s.title, heroSub: s.sub, heroIcon: s.icon,
      heroIconBg: '#FFB22C',
      progress: Math.round(((cur + 1) / stages.length) * 100) + '%',
    };
  }
}
</script>
</body>
</html>
